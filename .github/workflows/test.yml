name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse scripts
        shell: powershell
        run: |
          $hata = 0
          foreach ($f in Get-ChildItem -Recurse -Filter *.ps1) {
            $e = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$e)
            if (@($e).Count -gt 0) { $e | ForEach-Object { Write-Host "$($f.Name): $($_.Message) @ $($_.Extent.StartLineNumber)" }; $hata++ }
          }
          if ($hata -gt 0) { exit 1 }

      - name: End-to-end sync test
        shell: powershell
        run: .\tests\Test-Sync.ps1
